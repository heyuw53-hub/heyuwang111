# Requête quotidienne vers Supabase pour éviter la mise en pause du projet gratuit.
# Prérequis : secret de dépôt DATABASE_URL (même valeur que dans Streamlit Cloud).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours à 06:17 UTC
  workflow_dispatch:         # bouton « Run workflow » pour un test manuel

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - name: Requête Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/supabase_keepalive.py
